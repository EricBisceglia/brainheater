<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Brain Heater
    </title>
    <link rel="stylesheet" href="./css/brainheater.css">
    <link rel="icon" href="./favicon.ico">
    <script src="./lang/language.js" defer></script>
    <script src="./lang/translations.js" defer></script>
    <script src="./levels/levels.js" defer></script>
    <script src="./game/display.js" defer></script>
    <script src="./game/game.js" defer></script>
    <script src="./game/save.js" defer></script>
    <script src="./game/controls.js" defer></script>
    <script src="./game/main.js" defer></script>
  </head>
  <body>
    <main class="brain_container">




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                     HEADER                                                     -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <header class="brain_header">
        <h1 class="brain_title">
          Brain <span>Heater</span><i>!</i>
        </h1>
        <button type="button" id="settings_open" class="settings_open" data-i18n="settings"></button>
      </header>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                   GAME BOARD                                                   -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <section id="brain_area">

        <!-- Game board -->
        <div class="brain_board_container">

          <!-- Main board -->
          <div id="brain_board" class="brain_board" tabindex="0">
          </div>

          <!-- Death message -->
          <div id="death_message" class="death_message" hidden>
            <h3 data-i18n="death_title"></h3>
            <p data-i18n="death_restart"></p>
          </div>

          <!-- Eraser pickups -->
          <div id="eraser_counter" class="eraser_counter" hidden>
            <span class="eraser_icon"></span>
            <span id="eraser_count"></span>
          </div>

        </div>
      </section>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                  LEVEL SELECT                                                  -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <nav class="level_selection">
        <select id="levelset_select" class="levelset_select">
        </select>
        <div id="level_buttons" class="level_buttons">
        </div>
      </nav>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                     FOOTER                                                     -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <!-- Controls -->
      <p class="controls">
        <span data-i18n="controls_move"></span><br>
        <span data-i18n="controls_restart"></span>
      </p>

      <!-- Links / credits -->
      <nav class="link_buttons">
        <a href="https://thebad.website/" target="_blank" rel="noopener noreferrer">
          thebad.website
        </a>
        <a href="https://discord.gg/XTd3qQKZqV" target="_blank" rel="noopener noreferrer">
          Discord
        </a>
      </nav>

    </main>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                    SETTINGS                                                    -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

    <dialog id="settings_menu" class="settings_menu">

      <div class="settings_header">
        <h2 data-i18n="settings"></h2>
        <button type="button" id="settings_close" data-i18n="settings_close"></button>
      </div>

      <div class="settings_row">
        <label for="language_select" data-i18n="settings_language"></label>
        <select id="language_select" class="language_select">
          <option value="en" data-i18n="language_en"></option>
          <option value="fr" data-i18n="language_fr"></option>
        </select>
      </div>

      <div class="settings_row">
        <label for="colorblind_toggle" data-i18n="settings_colorblind"></label>
        <input type="checkbox" id="colorblind_toggle" class="colorblind_toggle">
      </div>

      <button type="button" id="progress_reset" class="progress_reset" data-i18n="reset_progress"></button>

    </dialog>

  </body>
</html>
