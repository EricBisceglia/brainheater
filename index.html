<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Brain Heater
    </title>
    <link rel="stylesheet" href="./css/brainheater.css">
    <link rel="icon" href="./favicon.ico">
    <script src="./js/levels.js" defer></script>
    <script src="./js/display.js" defer></script>
    <script src="./js/game.js" defer></script>
    <script src="./js/save.js" defer></script>
    <script src="./js/controls.js" defer></script>
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <main class="brain_container">




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                     HEADER                                                     -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <header class="brain_header">
        <h1 class="brain_title">
          Brain <span>Heater</span><i aria-hidden="true">!</i>
        </h1>
      </header>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                   GAME BOARD                                                   -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <section id="brain_area" aria-label="Current puzzle">

        <!-- Level info -->
        <div class="level_info">
          <span id="level_number" class="level_number">
            01/10
          </span>
          <h2 id="level_name">
            First steps
          </h2>
        </div>

        <!-- Game board -->
        <div class="brain_board_container">

          <!-- Main board -->
          <div id="brain_board" class="brain_board" tabindex="0" role="group" aria-label="Puzzle grid">
          </div>

          <!-- Death message -->
          <div id="death_message" class="death_message" role="status" aria-live="polite" hidden>
            <h3>Oops.</h3>
            <p>Press space to restart.</p>
          </div>

        </div>
      </section>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                  LEVEL SELECT                                                  -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <nav class="level_selection" aria-label="Level selector">
        <select id="levelset_select" class="levelset_select" aria-label="Level sets">
        </select>
        <div id="level_buttons" class="level_buttons">
        </div>
      </nav>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                     FOOTER                                                     -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <!-- Controls -->
      <p class="controls">
        Move with arrow keys<br>
        Space to restart
      </p>

      <!-- Links / credits / reset progression -->
      <nav class="link_buttons" aria-label="thebad.website">
        <a href="https://discord.gg/XTd3qQKZqV" target="_blank" rel="noopener noreferrer">
          Discord
        </a>
        <a href="https://thebad.website/" target="_blank" rel="noopener noreferrer">
          thebad.website
        </a>
        <button type="button" id="progress_reset" class="progress_reset">
          Reset progression
        </button>
      </nav>

    </main>
  </body>
</html>
