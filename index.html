<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brain Heater</title>
    <meta name="description" content="Play Brain Heater, a free puzzle game in your browser, courtesy of The Bad Website :)">
    <meta name="author" content="Bad">
    <meta name="theme-color" content="#171B22">
    <link rel="canonical" href="https://thebad.website/games/brainheater/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Brain Heater">
    <meta property="og:title" content="Brain Heater">
    <meta property="og:description" content="Play Brain Heater, a free puzzle game in your browser on The Bad Website :)">
    <meta property="og:url" content="https://thebad.website/games/brainheater/">
    <meta property="og:image" content="https://thebad.website/games/brainheater/img/preview.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Some scribbles on a notebook shaped like colored Xs and an O.">
    <link rel="stylesheet" href="./css/brainheater.css">
    <link rel="stylesheet" href="./css/board.css">
    <link rel="stylesheet" href="./css/menus.css">
    <link rel="stylesheet" href="./css/ending.css">
    <link rel="stylesheet" href="./css/mobile.css">
    <link rel="icon" href="./favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./img/apple-touch-icon.png">
    <script src="./lang/language.js" defer></script>
    <script src="./lang/translations.js" defer></script>
    <script src="./levels/levels.js" defer></script>
    <script src="./game/game.js" defer></script>
    <script src="./game/progress.js" defer></script>
    <script src="./game/tiles.js" defer></script>
    <script src="./game/movement.js" defer></script>
    <script src="./game/display.js" defer></script>
    <script src="./game/animations.js" defer></script>
    <script src="./game/interface.js" defer></script>
    <script src="./game/controls.js" defer></script>
    <script src="./game/touch.js" defer></script>
    <script src="./game/main.js" defer></script>
  </head>
  <body>
    <main class="brain_container">




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                     HEADER                                                     -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <header class="brain_header">
        <h1 class="brain_title">
          Brain <span>Heater</span><i>!</i>
        </h1>
      </header>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                   GAME BOARD                                                   -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <section id="brain_area">

        <!-- Game board -->
        <div class="brain_board_container">

          <!-- Main board -->
          <div id="brain_board" class="brain_board" tabindex="0">
          </div>

          <!-- Death message -->
          <div id="death_message" class="death_message" hidden>
            <h3 data-i18n="death_title"></h3>
            <p class="keyboard_only" data-i18n="death_restart"></p>
            <button type="button" id="death_touch_restart" class="touch_only death_touch_restart" data-i18n="death_touch_restart"></button>
          </div>

          <!-- Eraser pickups -->
          <div id="eraser_counter" class="eraser_counter" hidden>
            <span class="eraser_icon"></span>
            <span id="eraser_count"></span>
          </div>

        </div>
      </section>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                  LEVEL SELECT                                                  -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <nav class="level_selection">
        <select id="levelset_select" class="levelset_select">
        </select>
        <div id="level_buttons" class="level_buttons">
        </div>
      </nav>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                     FOOTER                                                     -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

      <!-- Controls -->
      <p class="controls keyboard_only">
        <span data-i18n="controls_move"></span><br>
        <span data-i18n="controls_restart"></span>
      </p>
      <p class="controls touch_only" data-i18n="controls_swipe"></p>

      <!-- Links / settings / credits -->
      <nav class="link_buttons">
        <a href="https://thebad.website/" target="_blank" rel="noopener noreferrer" data-i18n="link_website"></a>
        <button type="button" id="settings_open" class="settings_open" data-i18n="settings"></button>
        <a href="https://discord.gg/XTd3qQKZqV" target="_blank" rel="noopener noreferrer" data-i18n="link_discord"></a>
      </nav>

    </main>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                    SETTINGS                                                    -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

    <dialog id="settings_menu" class="settings_menu">

      <div class="settings_header">
        <h2 data-i18n="settings"></h2>
        <button type="button" id="settings_close" data-i18n="settings_close"></button>
      </div>

      <div class="settings_row">
        <label for="language_select" data-i18n="settings_language"></label>
        <select id="language_select" class="language_select">
          <option value="en" data-i18n="language_en"></option>
          <option value="fr" data-i18n="language_fr"></option>
        </select>
      </div>

      <div class="settings_row">
        <label for="colorblind_toggle" data-i18n="settings_colorblind"></label>
        <input type="checkbox" id="colorblind_toggle" class="colorblind_toggle">
      </div>

      <button type="button" id="progress_reset" class="progress_reset" data-i18n="reset_progress"></button>

    </dialog>




<!-------------------------------------------------------------------------------------------------------------------->
<!--                                                                                                                -->
<!--                                                     ENDING                                                     -->
<!--                                                                                                                -->
<!-------------------------------------------------------------------------------------------------------------------->

    <dialog id="ending_screen" class="ending_screen">
      <article class="ending_notebook">
        <h2 class="ending_title" data-i18n="ending_title"></h2>

        <p data-i18n="ending_story"></p>
        <p data-i18n="ending_thanks"></p>

        <div class="ending_signature brain_title">
          <span data-i18n="ending_signature"></span>
        </div>

        <nav class="ending_buttons">
          <button type="button" id="ending_close" class="ending_close" data-i18n="ending_close"></button>
          <a href="https://thebad.website/" target="_blank" rel="noopener noreferrer" data-i18n="link_website"></a>
          <a href="https://discord.gg/XTd3qQKZqV" target="_blank" rel="noopener noreferrer" data-i18n="link_discord"></a>
        </nav>

      </article>
    </dialog>

  </body>
</html>
